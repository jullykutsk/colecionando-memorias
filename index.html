<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura, Leveza e Companhia</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Playfair Display & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2pdf.js para gerar o PDF bonitão direto pelo navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            palette: {
              primary: '#D35400',
              secondary: '#F5EEF0',
              accent: '#E67E22',
              dark: '#4A235A',
              cardbg: '#FFFFFF',
              border: '#EADCD7',
              bg: '#FAF6F0'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #FAF6F0;
      color: #4A235A;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .paper-texture {
      background-image: radial-gradient(#EADCD7 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="paper-texture min-h-screen pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      {
        id: 'A',
        title: 'Natureza e Água',
        items: [
          'Tomar banho em uma cachoeira',
          'Fazer uma trilha ao ar livre',
          'Escalar uma montanha / mirante',
          'Conhecer uma praia, rio ou lago',
          'Passeio de caiaque ou pedalinho',
          'Andar de barco',
          'Fazer um piquenique ao ar livre',
          'Acampar ou passar uma noite num lugar diferente',
          'Observar as estrelas à noite',
          'Fazer uma trilha no nascer ou pôr do sol'
        ]
      },
      {
        id: 'B',
        title: 'Aventura e Novas Sensações',
        items: [
          'Fazer escalada indoor',
          'Andar a cavalo',
          'Fazer arvorismo ou tirolesa',
          'Andar de kart',
          'Experimentar um esporte novo',
          'Visitar um parque de aventuras',
          'Fazer um passeio de patinete / bike',
          'Experimentar uma atividade de adrenalina',
          'Fazer algo totalmente inédito'
        ]
      },
      {
        id: 'C',
        title: 'Animais e Descobertas',
        items: [
          'Ter contato direto com animais',
          'Visitar uma fazenda ou sítio',
          'Conhecer um parque/santuário animal',
          'Observar animais na natureza',
          'Conhecer um local ou espécie nova de perto'
        ]
      },
      {
        id: 'D',
        title: 'Cultura, Arte e Criatividade',
        items: [
          'Visitar um museu ou exposição',
          'Ir ao teatro ou concerto',
          'Assistir a um show ao vivo',
          'Fazer oficina de cerâmica/argila',
          'Experimentar pintura ou desenho',
          'Fazer atividade de fotografia',
          'Participar de uma aula de culinária',
          'Fazer uma aula de dança juntos',
          'Conhecer um lugar histórico',
          'Visitar uma livraria ou biblioteca temática',
          'Aprender uma habilidade nova juntos'
        ]
      },
      {
        id: 'E',
        title: 'Jogos, Desafios e Diversão',
        items: [
          'Participar de um Escape Room',
          'Jogar jogos de tabuleiro à tarde',
          'Caça ao tesouro / enigmas',
          'Jogar boliche',
          'Ir a um fliperama / arcade',
          'Jogo de perguntas e desafios íntimos',
          'Fazer uma competição divertida',
          'Desafio de trabalho em equipe'
        ]
      },
      {
        id: 'F',
        title: 'Gastronomia e Experiências',
        items: [
          'Passeio gastronômico na cidade',
          'Conhecer um restaurante exótico',
          'Experimentar uma comida inédita',
          'Cozinhar uma receita elaborada juntos',
          'Degustação de doces ou tour de cafés',
          'Visitar uma cafeteria temática',
          'Preparar um jantar especial',
          'Descobrir um cantinho escondido da cidade'
        ]
      },
      {
        id: 'G',
        title: 'Encontros e Momentos Especiais',
        items: [
          'Passeio tranquilo sem pressa',
          'Conversa profunda em um lugar bonito',
          'Assistir ao pôr do sol juntos',
          'Passeio surpresa de presente',
          'Lugar novo sem saber os detalhes',
          'Criar um projeto ou arte juntos',
          'Atividade voluntária / solidária',
          'Passar algumas horas sem celular',
          'Passeio super econômico e criativo',
          'Planejar uma experiência com significado'
        ]
      }
    ];

    const INITIAL_MEETINGS = Array.from({ length: 12 }, (_, i) => ({
      number: i + 1,
      title: `Encontro ${String(i + 1).padStart(2, '0')}`,
      organizer: i % 2 === 0 ? 'Pessoa 1' : 'Pessoa 2',
      date: '',
      location: '',
      timeDeparture: '',
      timeReturn: '',
      spoiler: '',
      status: 'planned',
      memory: { photo: null, word: '', likedMost: '', momentToKeep: '', nextIdea: '' }
    }));

    const INITIAL_QUIZ_QUESTIONS = [
      { id: 1, question: 'Qual é a minha comida de conforto favorita para um dia relaxante?' },
      { id: 2, question: 'Se eu ganhasse uma viagem surpresa hoje, para onde eu iria?' },
      { id: 3, question: 'Qual foi o momento mais divertido ou engraçado que tivemos juntos até agora?' },
      { id: 4, question: 'Um lugar de infância especial que eu gostaria de te levar:' },
      { id: 5, question: 'Qual é a minha maior mania ou hábito curioso no dia a dia?' }
    ];

    const INITIAL_SCRATCH_CARDS = [
      { id: 1, title: 'Cartão Surpresa 1', prize: 'Noite de fondue e filme escolhido pelo sortudo!', scratched: false },
      { id: 2, title: 'Cartão Surpresa 2', prize: 'Passeio surpresa de 2 horas em um lugar verde!', scratched: false },
      { id: 3, title: 'Cartão Surpresa 3', prize: 'Café da manhã especial preparado pelo outro!', scratched: false },
      { id: 4, title: 'Cartão Surpresa 4', prize: 'Desafio de culinária: misturar 3 ingredientes surpresa!', scratched: false }
    ];

    const INITIAL_BINGO = [
      { id: 1, text: 'Tirar uma foto engraçada com um animal na rua', done: false },
      { id: 2, text: 'Provar um sabor de sorvete totalmente novo', done: false },
      { id: 3, text: 'Fazer um elogio surpresa com bilhetinho', done: false },
      { id: 4, text: 'Caminhar 30 minutos sem olhar no telemóvel', done: false },
      { id: 5, text: 'Comprar um lanche surpresa para o outro', done: false },
      { id: 6, text: 'Assistir ao pôr do sol em um local diferente', done: false },
      { id: 7, text: 'Tirar uma selfie criativa em um ponto turístico', done: false },
      { id: 8, text: 'Ouvir um álbum musical inteiro juntos', done: false },
      { id: 9, text: 'Escrever uma gratidão mútua em um papel', done: false }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      
      const [names, setNames] = useState(() => {
        const saved = localStorage.getItem('guia_names');
        return saved ? JSON.parse(saved) : { person1: 'Jully', person2: 'Pedro' };
      });

      const [userProfileName, setUserProfileName] = useState('Jully');

      const [ratings, setRatings] = useState(() => {
        const saved = localStorage.getItem('guia_ratings');
        return saved ? JSON.parse(saved) : {};
      });

      const [meetings, setMeetings] = useState(() => {
        const saved = localStorage.getItem('guia_meetings');
        return saved ? JSON.parse(saved) : INITIAL_MEETINGS;
      });

      const [quizAnswers, setQuizAnswers] = useState(() => {
        const saved = localStorage.getItem('guia_quiz_answers');
        return saved ? JSON.parse(saved) : {};
      });

      const [scratchCards, setScratchCards] = useState(() => {
        const saved = localStorage.getItem('guia_scratch');
        return saved ? JSON.parse(saved) : INITIAL_SCRATCH_CARDS;
      });

      const [bingoItems, setBingoItems] = useState(() => {
        const saved = localStorage.getItem('guia_bingo');
        return saved ? JSON.parse(saved) : INITIAL_BINGO;
      });

      const [selectedMeetingNum, setSelectedMeetingNum] = useState(1);
      const [openCategories, setOpenCategories] = useState({});
      const [memorySubTab, setMemorySubTab] = useState('diario');

      const [timeCapsule, setTimeCapsule] = useState(() => {
        const saved = localStorage.getItem('guia_time_capsule');
        return saved ? JSON.parse(saved) : {
          openDate: 'Conclusão dos 12 Encontros',
          dreamDestination: '',
          bestExpectation: '',
          secretMessage: '',
          isSealed: false
        };
      });

      const [rouletteWinner, setRouletteWinner] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [rotationDegree, setRotationDegree] = useState(0);

      useEffect(() => { localStorage.setItem('guia_names', JSON.stringify(names)); }, [names]);
      useEffect(() => { localStorage.setItem('guia_ratings', JSON.stringify(ratings)); }, [ratings]);
      useEffect(() => { localStorage.setItem('guia_meetings', JSON.stringify(meetings)); }, [meetings]);
      useEffect(() => { localStorage.setItem('guia_quiz_answers', JSON.stringify(quizAnswers)); }, [quizAnswers]);
      useEffect(() => { localStorage.setItem('guia_time_capsule', JSON.stringify(timeCapsule)); }, [timeCapsule]);
      useEffect(() => { localStorage.setItem('guia_scratch', JSON.stringify(scratchCards)); }, [scratchCards]);
      useEffect(() => { localStorage.setItem('guia_bingo', JSON.stringify(bingoItems)); }, [bingoItems]);

      const spinRoulette = () => {
        if (isSpinning) return;
        setIsSpinning(true);
        setRouletteWinner(null);

        const combinedString = (names.person1 + names.person2).toLowerCase();
        let charCodeSum = 0;
        for (let i = 0; i < combinedString.length; i++) {
          charCodeSum += combinedString.charCodeAt(i);
        }
        
        const winnerKey = charCodeSum % 2 === 0 ? 'person1' : 'person2';
        const winnerName = names[winnerKey];

        const extraSpins = 360 * 5; 
        const targetAngle = winnerKey === 'person1' ? 0 : 180;
        const currentMod = rotationDegree % 360;
        const totalRotation = rotationDegree + extraSpins + (targetAngle - currentMod + 360) % 360;

        setRotationDegree(totalRotation);

        setTimeout(() => {
          setRouletteWinner(winnerName);
          setIsSpinning(false);
        }, 3000);
      };

      const toggleCategory = (catId) => {
        setOpenCategories(prev => ({ ...prev, [catId]: !prev[catId] }));
      };

      const handleRating = (itemKey, stars) => {
        setRatings(prev => ({ ...prev, [itemKey]: stars }));
      };

      const handleMeetingUpdate = (updatedMeeting) => {
        setMeetings(prev => prev.map(m => m.number === updatedMeeting.number ? updatedMeeting : m));
      };

      const scratchCard = (id) => {
        setScratchCards(prev => prev.map(card => card.id === id ? { ...card, scratched: true } : card));
      };

      const toggleBingo = (id) => {
        setBingoItems(prev => prev.map(item => item.id === id ? { ...item, done: !item.done } : item));
      };

      const generatePDF = () => {
        const element = document.getElementById('pdf-template');
        const opt = {
          margin:       0.5,
          filename:     `Preferencias_Encontros_${userProfileName || 'MeuPerfil'}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        
        element.style.display = 'block';
        window.html2pdf().set(opt).from(element).save().then(() => {
          element.style.display = 'none';
        });
      };

      const generateQuizPDF = () => {
        const element = document.getElementById('quiz-pdf-template');
        const opt = {
          margin:       0.5,
          filename:     `Quiz_Conexao_${userProfileName || 'MeuPerfil'}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        
        element.style.display = 'block';
        window.html2pdf().set(opt).from(element).save().then(() => {
          element.style.display = 'none';
        });
      };

      const completedCount = meetings.filter(m => m.status === 'completed').length;

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <header className="text-center my-8 border-b border-palette-border pb-8">
            <span className="inline-block px-3 py-1 bg-palette-secondary text-palette-primary rounded-full text-xs font-semibold tracking-wider uppercase mb-3 border border-palette-border">
              Colecionando Memórias
            </span>
            <h1 className="font-serif text-xl sm:text-2xl md:text-4xl text-palette-dark font-bold mb-3 whitespace-nowrap overflow-hidden text-ellipsis">
              Aventura, Leveza e Companhia
            </h1>

            <div className="mt-6 max-w-xs mx-auto bg-palette-secondary p-3 rounded-2xl border border-palette-border">
              <div className="flex justify-between text-xs font-semibold text-palette-dark mb-1">
                <span>Jornada dos 12 Encontros</span>
                <span>{completedCount} de 12 concluídos</span>
              </div>
              <div className="w-full bg-palette-border h-2.5 rounded-full overflow-hidden">
                <div 
                  className="bg-palette-primary h-full transition-all duration-500 rounded-full"
                  style={{ width: `${(completedCount / 12) * 100}%` }}
                ></div>
              </div>
            </div>
          </header>

          <nav className="flex justify-center gap-2 md:gap-3 mb-8 overflow-x-auto pb-2">
            {[
              { id: 'home', label: 'Introdução' },
              { id: 'form', label: 'Formulário' },
              { id: 'quiz', label: 'Quiz de Conexão' },
              { id: 'meetings', label: '12 Encontros' },
              { id: 'memories', label: 'Memórias' },
              { id: 'games', label: 'Raspadinha & Bingo' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                  activeTab === tab.id
                    ? 'bg-palette-primary text-white shadow-md'
                    : 'bg-white text-palette-dark hover:bg-palette-secondary border border-palette-border'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          <main>
            {activeTab === 'home' && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                <div className="my-2 space-y-4">
                  <div className="p-5 bg-palette-secondary/50 rounded-2xl border border-palette-border">
                    <h3 className="font-semibold text-palette-primary text-lg mb-2">
                      Organização das Experiências
                    </h3>
                    <p className="text-sm text-palette-dark/80 leading-relaxed">
                      Ao longo dos 12 encontros, cada um fica responsável por organizar a experiência do mês, alternando. Quem organiza escolhe a atividade, arca com eventuais custos, pesquisa e cuida dos detalhes.
                    </p>
                  </div>

                  <div className="p-5 bg-palette-secondary/50 rounded-2xl border border-palette-border">
                    <p className="text-sm text-palette-dark/80 leading-relaxed font-medium">
                      A vida pode ser leve e divertida. A ideia é sair um pouquinho da rotina, experimentar coisas novas, surpreender e explorar.
                    </p>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-3xl border border-palette-border shadow-sm grid md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                      Editar Nome da Pessoa 1:
                    </label>
                    <input
                      type="text"
                      value={names.person1}
                      onChange={e => setNames({ ...names, person1: e.target.value })}
                      className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm font-semibold text-palette-dark focus:outline-none focus:border-palette-primary"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                      Editar Nome da Pessoa 2:
                    </label>
                    <input
                      type="text"
                      value={names.person2}
                      onChange={e => setNames({ ...names, person2: e.target.value })}
                      className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm font-semibold text-palette-dark focus:outline-none focus:border-palette-primary"
                    />
                  </div>
                </div>

                <div className="bg-gradient-to-r from-palette-secondary to-white p-6 rounded-3xl border-2 border-palette-border text-center space-y-4 shadow-sm">
                  <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">
                    Brincadeira da Sorte
                  </span>
                  <h3 className="font-serif font-bold text-xl md:text-2xl text-palette-dark">
                    Quem começa a organizar o 1º encontro?
                  </h3>
                  
                  <div className="flex flex-col items-center justify-center py-4">
                    <div className="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[16px] border-b-palette-primary mb-[-6px] z-10"></div>
                    
                    <div 
                      className="w-48 h-48 rounded-full border-4 border-palette-primary shadow-lg relative overflow-hidden flex items-center justify-center bg-white"
                      style={{
                        transform: `rotate(${rotationDegree}deg)`,
                        transition: isSpinning ? 'transform 3s cubic-bezier(0.15, 0.85, 0.15, 1)' : 'none'
                      }}
                    >
                      <div className="absolute top-0 left-0 w-full h-1/2 bg-[#F5EEF0] border-b border-palette-border flex items-center justify-center pt-2 px-2 text-center">
                        <span className="font-serif font-bold text-palette-dark text-sm truncate">{names.person1}</span>
                      </div>
                      <div className="absolute bottom-0 left-0 w-full h-1/2 bg-[#D35400] flex items-center justify-center pb-2 px-2 text-center">
                        <span className="font-serif font-bold text-white text-sm truncate">{names.person2}</span>
                      </div>
                      <div className="absolute w-6 h-6 bg-palette-dark rounded-full border-2 border-white shadow"></div>
                    </div>
                  </div>

                  {rouletteWinner && !isSpinning && (
                    <div className="p-3 bg-palette-primary text-white rounded-xl font-bold text-lg animate-bounce shadow-md inline-block px-6">
                      {rouletteWinner} começa!
                    </div>
                  )}

                  <div>
                    <button
                      onClick={spinRoulette}
                      disabled={isSpinning}
                      className="px-6 py-3 bg-palette-primary text-white font-medium rounded-xl hover:bg-palette-accent transition disabled:opacity-50 text-sm shadow-md"
                    >
                      {isSpinning ? 'A girar a roleta...' : 'Girar Roleta'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'form' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                  <div>
                    <h2 className="font-serif text-2xl font-bold text-palette-dark">
                      Formulário de Preferências
                    </h2>
                    <p className="text-sm text-palette-dark/60">
                      Preencha suas notas e gere o PDF no final para enviar ao seu par.
                    </p>
                  </div>

                  <div className="w-full md:w-auto bg-palette-secondary p-3 rounded-2xl border border-palette-border flex items-center gap-2">
                    <label className="text-xs font-bold text-palette-dark whitespace-nowrap">
                      Meu Nome:
                    </label>
                    <input
                      type="text"
                      value={userProfileName}
                      onChange={e => setUserProfileName(e.target.value)}
                      placeholder="Digite seu nome"
                      className="p-2 bg-white border border-palette-border rounded-xl text-xs font-bold text-palette-primary focus:outline-none w-full"
                    />
                  </div>
                </div>

                <div className="space-y-4">
                  {CATEGORIES.map(cat => {
                    const isOpen = !!openCategories[cat.id];
                    const ratedCount = cat.items.filter((_, idx) => (ratings[`${cat.id}_${idx}`] || 0) > 0).length;

                    return (
                      <div key={cat.id} className="bg-white rounded-3xl border border-palette-border shadow-sm overflow-hidden transition-all">
                        <button
                          onClick={() => toggleCategory(cat.id)}
                          className="w-full p-5 bg-palette-secondary/30 hover:bg-palette-secondary/60 flex items-center justify-between gap-3 text-left transition"
                        >
                          <h3 className="font-serif font-bold text-lg md:text-xl text-palette-primary flex-1 min-w-0">
                            {cat.title}
                          </h3>
                          <div className="flex items-center gap-3 shrink-0">
                            <span className="text-xs bg-palette-primary/10 text-palette-primary px-2.5 py-1 rounded-full font-semibold whitespace-nowrap">
                              {ratedCount}/{cat.items.length} avaliados
                            </span>
                            <span className="text-palette-primary font-bold text-2xl w-6 text-center">
                              {isOpen ? '−' : '+'}
                            </span>
                          </div>
                        </button>

                        {isOpen && (
                          <div className="p-6 grid md:grid-cols-2 gap-4 border-t border-palette-border bg-white">
                            {cat.items.map((item, idx) => {
                              const itemKey = `${cat.id}_${idx}`;
                              const currentStar = ratings[itemKey] || 0;

                              return (
                                <div key={idx} className="p-4 rounded-2xl border flex flex-col justify-between bg-palette-secondary/30 border-palette-border/60">
                                  <span className="font-medium text-sm text-palette-dark mb-3">{item}</span>
                                  <div className="flex items-center gap-1">
                                    {[1, 2, 3, 4, 5].map(star => (
                                      <button
                                        key={star}
                                        onClick={() => handleRating(itemKey, star)}
                                        className={`text-2xl transition-transform hover:scale-125 ${
                                          star <= currentStar ? 'text-amber-500' : 'text-gray-300'
                                        }`}
                                      >
                                        ★
                                      </button>
                                    ))}
                                    <span className="ml-2 text-xs text-palette-dark/50">
                                      {currentStar > 0 ? `${currentStar}/5` : 'Não avaliado'}
                                    </span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <div className="bg-gradient-to-r from-palette-primary to-palette-accent p-6 rounded-3xl text-white flex flex-col md:flex-row items-center justify-between gap-4 shadow-md mt-8">
                  <div>
                    <h3 className="font-serif font-bold text-xl mb-1">Finalizou suas escolhas?</h3>
                    <p className="text-xs opacity-90">Gere um PDF bonito com suas respostas e mande no WhatsApp!</p>
                  </div>
                  <button
                    onClick={generatePDF}
                    className="px-6 py-3 bg-white text-palette-primary font-bold rounded-2xl hover:bg-palette-secondary transition text-sm shadow-md whitespace-nowrap"
                  >
                    Baixar Meu PDF Personalizado
                  </button>
                </div>
              </div>
            )}

            {/* ABA: QUIZ DE CONEXÃO COM GERADOR DE PDF */}
            {activeTab === 'quiz' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                  <div>
                    <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">Conversa e Intimidade Leve</span>
                    <h2 className="font-serif text-2xl font-bold text-palette-dark">Quiz de Conexão</h2>
                    <p className="text-sm text-palette-dark/60">Responda às perguntas abaixo e gere um PDF para compartilhar com seu par!</p>
                  </div>

                  <div className="w-full md:w-auto bg-palette-secondary p-3 rounded-2xl border border-palette-border flex items-center gap-2">
                    <label className="text-xs font-bold text-palette-dark whitespace-nowrap">Meu Nome:</label>
                    <input
                      type="text"
                      value={userProfileName}
                      onChange={e => setUserProfileName(e.target.value)}
                      placeholder="Digite seu nome"
                      className="p-2 bg-white border border-palette-border rounded-xl text-xs font-bold text-palette-primary focus:outline-none w-full"
                    />
                  </div>
                </div>

                <div className="space-y-4">
                  {INITIAL_QUIZ_QUESTIONS.map((q) => (
                    <div key={q.id} className="p-6 bg-white rounded-3xl border border-palette-border shadow-sm space-y-3">
                      <span className="text-xs font-bold text-palette-primary uppercase">Pergunta {q.id} de {INITIAL_QUIZ_QUESTIONS.length}</span>
                      <h3 className="font-serif font-bold text-lg text-palette-dark">{q.question}</h3>
                      <textarea
                        rows="2"
                        value={quizAnswers[q.id] || ''}
                        onChange={e => setQuizAnswers({ ...quizAnswers, [q.id]: e.target.value })}
                        placeholder="Escreva sua resposta aqui..."
                        className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                      ></textarea>
                    </div>
                  ))}
                </div>

                {/* BOTÃO DE GERAR PDF DO QUIZ */}
                <div className="bg-gradient-to-r from-palette-primary to-palette-accent p-6 rounded-3xl text-white flex flex-col md:flex-row items-center justify-between gap-4 shadow-md mt-8">
                  <div>
                    <h3 className="font-serif font-bold text-xl mb-1">Terminou de responder?</h3>
                    <p className="text-xs opacity-90">Baixe o PDF com as suas respostas do Quiz e envie para o seu par no WhatsApp!</p>
                  </div>
                  <button
                    onClick={generateQuizPDF}
                    className="px-6 py-3 bg-white text-palette-primary font-bold rounded-2xl hover:bg-palette-secondary transition text-sm shadow-md whitespace-nowrap"
                  >
                    Baixar PDF do Quiz
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'meetings' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm">
                  <h2 className="font-serif text-2xl font-bold text-palette-dark mb-2">Fichas dos 12 Encontros</h2>
                  <p className="text-sm text-palette-dark/60 mb-6">Selecione o número do encontro para planejar os detalhes ou registrar como foi.</p>
                  <div className="grid grid-cols-4 md:grid-cols-6 gap-3">
                    {meetings.map(m => (
                      <button
                        key={m.number}
                        onClick={() => setSelectedMeetingNum(m.number)}
                        className={`p-3 rounded-2xl border font-serif text-center transition flex flex-col items-center justify-center ${
                          selectedMeetingNum === m.number
                            ? 'bg-palette-primary text-white border-palette-primary shadow-md scale-105'
                            : m.status === 'completed'
                            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                            : 'bg-palette-secondary/40 text-palette-dark border border-palette-border hover:bg-palette-secondary'
                        }`}
                      >
                        <span className="text-xs uppercase font-sans tracking-widest opacity-80">Nº</span>
                        <span className="text-2xl font-bold">{String(m.number).padStart(2, '0')}</span>
                        {m.status === 'completed' && <span className="text-[10px] font-sans font-semibold bg-emerald-200 text-emerald-900 px-1.5 py-0.5 rounded mt-1">Feito</span>}
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const currentMeeting = meetings.find(m => m.number === selectedMeetingNum);
                  if (!currentMeeting) return null;

                  return (
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                      <div className="flex justify-between items-center pb-4 border-b border-palette-border">
                        <div>
                          <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">Ficha de Planejamento</span>
                          <h3 className="font-serif text-3xl font-bold text-palette-dark">Encontro nº {String(currentMeeting.number).padStart(2, '0')}</h3>
                        </div>
                        <button
                          onClick={() => handleMeetingUpdate({
                            ...currentMeeting,
                            status: currentMeeting.status === 'completed' ? 'planned' : 'completed'
                          })}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                            currentMeeting.status === 'completed' ? 'bg-emerald-600 text-white' : 'bg-palette-secondary text-palette-dark border border-palette-border'
                          }`}
                        >
                          {currentMeeting.status === 'completed' ? '✓ Concluído' : 'Marcar Feito'}
                        </button>
                      </div>

                      <div className="grid md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">Nome da Experiência / Atividade</label>
                          <input
                            type="text"
                            value={currentMeeting.title}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, title: e.target.value })}
                            placeholder="Ex: Tarde de Cerâmica & Café"
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">Responsável pela Organização</label>
                          <select
                            value={currentMeeting.organizer}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, organizer: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          >
                            <option value="Pessoa 1">{names.person1}</option>
                            <option value="Pessoa 2">{names.person2}</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">Data Prevista</label>
                          <input
                            type="date"
                            value={currentMeeting.date}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, date: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">Local e Endereço</label>
                          <input
                            type="text"
                            value={currentMeeting.location}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, location: e.target.value })}
                            placeholder="Ex: Parque Central ou Ateliê X"
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {activeTab === 'memories' && (
              <div className="space-y-6">
                <div className="flex bg-white p-2 rounded-2xl border border-palette-border shadow-sm justify-center gap-2">
                  <button
                    onClick={() => setMemorySubTab('diario')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${memorySubTab === 'diario' ? 'bg-palette-primary text-white shadow-sm' : 'text-palette-dark/70 hover:text-palette-dark bg-palette-secondary/40'}`}
                  >
                    Diário dos Encontros
                  </button>
                  <button
                    onClick={() => setMemorySubTab('capsule')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${memorySubTab === 'capsule' ? 'bg-palette-primary text-white shadow-sm' : 'text-palette-dark/70 hover:text-palette-dark bg-palette-secondary/40'}`}
                  >
                    Cápsula do Tempo
                  </button>
                </div>

                {memorySubTab === 'capsule' && (
                  <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                    <div className="border-b border-palette-border pb-4">
                      <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">Nossa História</span>
                      <h2 className="font-serif text-3xl font-bold text-palette-dark">Cápsula do Tempo para o Futuro</h2>
                      <p className="text-sm text-palette-dark/60 mt-1">A cápsula ficará trancada até que todos os 12 encontros sejam concluídos!</p>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-palette-dark/70 mb-1">Qual o destino dos sonhos?</label>
                        <textarea
                          rows="2"
                          disabled={timeCapsule.isSealed}
                          value={timeCapsule.dreamDestination}
                          onChange={e => setTimeCapsule({ ...timeCapsule, dreamDestination: e.target.value })}
                          className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary disabled:opacity-60"
                        ></textarea>
                      </div>

                      <div className="pt-4 flex flex-col sm:flex-row items-center justify-between gap-4 bg-palette-secondary/30 p-5 rounded-2xl border border-palette-border">
                        <p className="font-bold text-palette-dark text-sm">Progresso: {completedCount} de 12 encontros concluídos</p>
                        <button
                          onClick={() => setTimeCapsule({ ...timeCapsule, isSealed: !timeCapsule.isSealed })}
                          className={`px-6 py-3 rounded-xl font-bold text-sm transition shadow-md ${timeCapsule.isSealed ? 'bg-amber-600 text-white' : 'bg-palette-primary text-white'}`}
                        >
                          {timeCapsule.isSealed ? '🔓 Desbloquear Cápsula' : '🔒 Selar Cápsula'}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'games' && (
              <div className="space-y-8">
                {/* 1. Raspadinha do Destino */}
                <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                  <div>
                    <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">Minijogo Interativo</span>
                    <h2 className="font-serif text-2xl font-bold text-palette-dark">Raspadinha do Destino</h2>
                    <p className="text-sm text-palette-dark/60">Clica em cima de um cartão para raspar e descobrir a atividade surpresa!</p>
                  </div>

                  <div className="grid sm:grid-cols-2 gap-4">
                    {scratchCards.map(card => (
                      <div 
                        key={card.id} 
                        onClick={() => scratchCard(card.id)}
                        className={`p-6 rounded-2xl border transition-all cursor-pointer text-center flex flex-col items-center justify-center min-h-[140px] shadow-sm ${
                          card.scratched 
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900' 
                            : 'bg-gradient-to-br from-palette-primary to-palette-accent text-white hover:scale-[1.02]'
                        }`}
                      >
                        {card.scratched ? (
                          <>
                            <span className="text-xs uppercase tracking-widest font-bold text-emerald-700 mb-1">Revelado! 🎉</span>
                            <p className="font-serif font-bold text-base">{card.prize}</p>
                          </>
                        ) : (
                          <>
                            <span className="text-3xl mb-2">🎟️</span>
                            <span className="font-serif font-bold text-lg">{card.title}</span>
                            <span className="text-xs opacity-90 mt-1">Clica aqui para raspar</span>
                          </>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {/* 2. Bingo de Desafios Relâmpago */}
                <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                  <div>
                    <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">Micro-aventuras</span>
                    <h2 className="font-serif text-2xl font-bold text-palette-dark">Bingo de Desafios Relâmpago</h2>
                    <p className="text-sm text-palette-dark/60">Cumpram os desafios no dia a dia e marchem na cartela!</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {bingoItems.map(item => (
                      <div
                        key={item.id}
                        onClick={() => toggleBingo(item.id)}
                        className={`p-4 rounded-2xl border transition cursor-pointer flex items-start gap-3 text-sm ${
                          item.done
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-900 line-through'
                            : 'bg-palette-secondary/30 border-palette-border text-palette-dark hover:bg-palette-secondary/60'
                        }`}
                      >
                        <span className="text-lg font-bold">{item.done ? '✅' : '⬜'}</span>
                        <span className="font-medium">{item.text}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* TEMPLATE DO PDF DE PREFERÊNCIAS */}
          <div id="pdf-template" style={{ display: 'none', padding: '20px', fontFamily: 'Plus Jakarta Sans, sans-serif' }}>
            <div style={{ textAlign: 'center', borderBottom: '2px solid #D35400', paddingBottom: '15px', marginBottom: '20px' }}>
              <span style={{ fontSize: '10px', color: '#D35400', textTransform: 'uppercase', fontWeight: 'bold' }}>Guia de Experiências & Encontros</span>
              <h1 style={{ fontFamily: 'Playfair Display, serif', color: '#4A235A', fontSize: '24px', margin: '5px 0' }}>Aventura, Leveza e Companhia</h1>
              <p style={{ fontSize: '14px', color: '#D35400', fontWeight: 'bold', margin: 0 }}>Perfil de Preferências: {userProfileName || 'Anônimo'}</p>
            </div>
          </div>

          {/* TEMPLATE DO PDF DO QUIZ */}
          <div id="quiz-pdf-template" style={{ display: 'none', padding: '20px', fontFamily: 'Plus Jakarta Sans, sans-serif' }}>
            <div style={{ textAlign: 'center', borderBottom: '2px solid #D35400', paddingBottom: '15px', marginBottom: '20px' }}>
              <span style={{ fontSize: '10px', color: '#D35400', textTransform: 'uppercase', fontWeight: 'bold' }}>Guia de Experiências & Encontros</span>
              <h1 style={{ fontFamily: 'Playfair Display, serif', color: '#4A235A', fontSize: '24px', margin: '5px 0' }}>Quiz de Conexão</h1>
              <p style={{ fontSize: '14px', color: '#D35400', fontWeight: 'bold', margin: 0 }}>Respostas de: {userProfileName || 'Anônimo'}</p>
            </div>

            {INITIAL_QUIZ_QUESTIONS.map(q => (
              <div key={q.id} style={{ marginBottom: '15px', padding: '10px', backgroundColor: '#FAF6F0', borderRadius: '8px', border: '1px solid #EADCD7' }}>
                <p style={{ fontSize: '12px', color: '#D35400', fontWeight: 'bold', margin: '0 0 5px 0' }}>{q.question}</p>
                <p style={{ fontSize: '12px', color: '#4A235A', margin: 0, whiteSpace: 'pre-wrap' }}>{quizAnswers[q.id] || '(Não respondido)'}</p>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
