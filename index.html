<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura, Leveza e Companhia</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Playfair Display & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2pdf.js para gerar o PDF bonitão direto pelo navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            palette: {
              primary: '#D35400',
              secondary: '#F5EEF0',
              accent: '#E67E22',
              dark: '#4A235A',
              cardbg: '#FFFFFF',
              border: '#EADCD7',
              bg: '#FAF6F0'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #FAF6F0;
      color: #4A235A;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .paper-texture {
      background-image: radial-gradient(#EADCD7 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="paper-texture min-h-screen pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      {
        id: 'A',
        title: 'A. Natureza e Água',
        items: [
          'Tomar banho em uma cachoeira',
          'Fazer uma trilha ao ar livre',
          'Escalar uma montanha / mirante',
          'Conhecer uma praia, rio ou lago',
          'Passeio de caiaque ou pedalinho',
          'Andar de barco',
          'Fazer um piquenique ao ar livre',
          'Acampar ou passar uma noite num lugar diferente',
          'Observar as estrelas à noite',
          'Fazer uma trilha no nascer ou pôr do sol'
        ]
      },
      {
        id: 'B',
        title: 'B. Aventura e Novas Sensações',
        items: [
          'Fazer escalada indoor',
          'Andar a cavalo',
          'Fazer arvorismo ou tirolesa',
          'Andar de kart',
          'Experimentar um esporte novo',
          'Visitar um parque de aventuras',
          'Fazer um passeio de patinete / bike',
          'Experimentar uma atividade de adrenalina',
          'Fazer algo totalmente inédito'
        ]
      },
      {
        id: 'C',
        title: 'C. Animais e Descobertas',
        items: [
          'Ter contato direto com animais',
          'Visitar uma fazenda ou sítio',
          'Conhecer um parque/santuário animal',
          'Observar animais na natureza',
          'Conhecer um local ou espécie nova de perto'
        ]
      },
      {
        id: 'D',
        title: 'D. Cultura, Arte e Criatividade',
        items: [
          'Visitar um museu ou exposição',
          'Ir ao teatro ou concerto',
          'Assistir a um show ao vivo',
          'Fazer oficina de cerâmica/argila',
          'Experimentar pintura ou desenho',
          'Fazer atividade de fotografia',
          'Participar de uma aula de culinária',
          'Fazer uma aula de dança juntos',
          'Conhecer um lugar histórico',
          'Visitar uma livraria ou biblioteca temática',
          'Aprender uma habilidade nova juntos'
        ]
      },
      {
        id: 'E',
        title: 'E. Jogos, Desafios e Diversão',
        items: [
          'Participar de um Escape Room',
          'Jogar jogos de tabuleiro à tarde',
          'Caça ao tesouro / enigmas',
          'Jogar boliche',
          'Ir a um fliperama / arcade',
          'Jogo de perguntas e desafios íntimos',
          'Fazer uma competição divertida',
          'Desafio de trabalho em equipe'
        ]
      },
      {
        id: 'F',
        title: 'F. Gastronomia e Experiências',
        items: [
          'Passeio gastronômico na cidade',
          'Conhecer um restaurante exótico',
          'Experimentar uma comida inédita',
          'Cozinhar uma receita elaborada juntos',
          'Degustação de doces ou tour de cafés',
          'Visitar uma cafeteria temática',
          'Preparar um jantar especial',
          'Descobrir um cantinho escondido da cidade'
        ]
      },
      {
        id: 'G',
        title: 'G. Encontros e Momentos Especiais',
        items: [
          'Passeio tranquilo sem pressa',
          'Conversa profunda em um lugar bonito',
          'Assistir ao pôr do sol juntos',
          'Passeio surpresa de presente',
          'Lugar novo sem saber os detalhes',
          'Criar um projeto ou arte juntos',
          'Atividade voluntária / solidária',
          'Passar algumas horas sem celular',
          'Passeio super econômico e criativo',
          'Planejar uma experiência com significado'
        ]
      }
    ];

    const INITIAL_MEETINGS = Array.from({ length: 12 }, (_, i) => ({
      number: i + 1,
      title: `Encontro ${String(i + 1).padStart(2, '0')}`,
      organizer: i % 2 === 0 ? 'Pessoa 1' : 'Pessoa 2',
      date: '',
      location: '',
      timeDeparture: '',
      timeReturn: '',
      spoiler: '',
      status: 'planned',
      memory: { photo: null, word: '', likedMost: '', momentToKeep: '', nextIdea: '' }
    }));

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      
      const [names, setNames] = useState(() => {
        const saved = localStorage.getItem('guia_names');
        return saved ? JSON.parse(saved) : { person1: 'Jully', person2: 'Pedro' };
      });

      const [userProfileName, setUserProfileName] = useState('Jully');

      const [ratings, setRatings] = useState(() => {
        const saved = localStorage.getItem('guia_ratings');
        return saved ? JSON.parse(saved) : {};
      });

      const [meetings, setMeetings] = useState(() => {
        const saved = localStorage.getItem('guia_meetings');
        return saved ? JSON.parse(saved) : INITIAL_MEETINGS;
      });
      const [selectedMeetingNum, setSelectedMeetingNum] = useState(1);
      const [openCategories, setOpenCategories] = useState({});

      const [rouletteWinner, setRouletteWinner] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [rotationDegree, setRotationDegree] = useState(0);

      useEffect(() => {
        localStorage.setItem('guia_names', JSON.stringify(names));
      }, [names]);

      useEffect(() => {
        localStorage.setItem('guia_ratings', JSON.stringify(ratings));
      }, [ratings]);

      useEffect(() => {
        localStorage.setItem('guia_meetings', JSON.stringify(meetings));
      }, [meetings]);

      const spinRoulette = () => {
        if (isSpinning) return;
        setIsSpinning(true);
        setRouletteWinner(null);

        const winnerKey = Math.random() < 0.5 ? 'person1' : 'person2';
        const winnerName = names[winnerKey];
        const extraSpins = 360 * 5; 
        const targetAngle = winnerKey === 'person1' ? 0 : 180;
        const currentMod = rotationDegree % 360;
        const totalRotation = rotationDegree + extraSpins + (targetAngle - currentMod + 360) % 360;

        setRotationDegree(totalRotation);

        setTimeout(() => {
          setRouletteWinner(winnerName);
          setIsSpinning(false);
        }, 3000);
      };

      const toggleCategory = (catId) => {
        setOpenCategories(prev => ({ ...prev, [catId]: !prev[catId] }));
      };

      const handleRating = (itemKey, stars) => {
        setRatings(prev => ({
          ...prev,
          [itemKey]: stars
        }));
      };

      const handleMeetingUpdate = (updatedMeeting) => {
        setMeetings(prev => prev.map(m => m.number === updatedMeeting.number ? updatedMeeting : m));
      };

      // Gerador de PDF elegante
      const generatePDF = () => {
        const element = document.getElementById('pdf-template');
        const opt = {
          margin:       0.5,
          filename:     `Preferencias_Encontros_${userProfileName || 'MeuPerfil'}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        
        element.style.display = 'block';
        window.html2pdf().set(opt).from(element).save().then(() => {
          element.style.display = 'none';
        });
      };

      const completedCount = meetings.filter(m => m.status === 'completed').length;

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <header className="text-center my-8 border-b border-palette-border pb-8">
            <span className="inline-block px-3 py-1 bg-palette-secondary text-palette-primary rounded-full text-xs font-semibold tracking-wider uppercase mb-3 border border-palette-border">
              Colecionando Memórias
            </span>
            <h1 className="font-serif text-xl sm:text-2xl md:text-4xl text-palette-dark font-bold mb-3 whitespace-nowrap overflow-hidden text-ellipsis">
              Aventura, Leveza e Companhia
            </h1>

            <div className="mt-6 max-w-xs mx-auto bg-palette-secondary p-3 rounded-2xl border border-palette-border">
              <div className="flex justify-between text-xs font-semibold text-palette-dark mb-1">
                <span>Jornada dos 12 Encontros</span>
                <span>{completedCount} de 12 concluídos</span>
              </div>
              <div className="w-full bg-palette-border h-2.5 rounded-full overflow-hidden">
                <div 
                  className="bg-palette-primary h-full transition-all duration-500 rounded-full"
                  style={{ width: `${(completedCount / 12) * 100}%` }}
                ></div>
              </div>
            </div>
          </header>

          <nav className="flex justify-center gap-2 md:gap-3 mb-8 overflow-x-auto pb-2">
            {[
              { id: 'home', label: 'Introdução' },
              { id: 'form', label: 'Formulário' },
              { id: 'ideas', label: 'Banco de Ideias' },
              { id: 'meetings', label: '12 Encontros' },
              { id: 'memories', label: 'Memórias' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                  activeTab === tab.id
                    ? 'bg-palette-primary text-white shadow-md'
                    : 'bg-white text-palette-dark hover:bg-palette-secondary border border-palette-border'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          <main>
            {activeTab === 'home' && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                
                <div className="my-2 space-y-4">
                  <div className="p-5 bg-palette-secondary/50 rounded-2xl border border-palette-border">
                    <h3 className="font-semibold text-palette-primary text-lg mb-2">
                      Organização das Experiências
                    </h3>
                    <p className="text-sm text-palette-dark/80 leading-relaxed">
                      Ao longo dos 12 encontros, cada um fica responsável por organizar a experiência do mês, alternando. Quem organiza escolhe a atividade, arca com eventuais custos, pesquisa e cuida dos detalhes.
                    </p>
                  </div>

                  <div className="p-5 bg-palette-secondary/50 rounded-2xl border border-palette-border">
                    <p className="text-sm text-palette-dark/80 leading-relaxed font-medium">
                      A vida pode ser leve e divertida. A ideia é sair um pouquinho da rotina, experimentar coisas novas, surpreender e explorar.
                    </p>
                  </div>
                </div>

                {/* CAIXA DE NOMES */}
                <div className="bg-white p-5 rounded-3xl border border-palette-border shadow-sm grid md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                      Editar Nome da Pessoa 1:
                    </label>
                    <input
                      type="text"
                      value={names.person1}
                      onChange={e => setNames({ ...names, person1: e.target.value })}
                      className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm font-semibold text-palette-dark focus:outline-none focus:border-palette-primary"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                      Editar Nome da Pessoa 2:
                    </label>
                    <input
                      type="text"
                      value={names.person2}
                      onChange={e => setNames({ ...names, person2: e.target.value })}
                      className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm font-semibold text-palette-dark focus:outline-none focus:border-palette-primary"
                    />
                  </div>
                </div>

                {/* ROLETA GIRATÓRIA */}
                <div className="bg-gradient-to-r from-palette-secondary to-white p-6 rounded-3xl border-2 border-palette-border text-center space-y-4 shadow-sm">
                  <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">
                    Brincadeira da Sorte
                  </span>
                  <h3 className="font-serif font-bold text-xl md:text-2xl text-palette-dark">
                    Quem começa a organizar o 1º encontro?
                  </h3>
                  
                  <div className="flex flex-col items-center justify-center py-4">
                    <div className="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[16px] border-b-palette-primary mb-[-6px] z-10"></div>
                    
                    <div 
                      className="w-48 h-48 rounded-full border-4 border-palette-primary shadow-lg relative overflow-hidden flex items-center justify-center bg-white"
                      style={{
                        transform: `rotate(${rotationDegree}deg)`,
                        transition: isSpinning ? 'transform 3s cubic-bezier(0.15, 0.85, 0.15, 1)' : 'none'
                      }}
                    >
                      <div className="absolute top-0 left-0 w-full h-1/2 bg-[#F5EEF0] border-b border-palette-border flex items-center justify-center pt-2 px-2 text-center">
                        <span className="font-serif font-bold text-palette-dark text-sm truncate">{names.person1}</span>
                      </div>
                      <div className="absolute bottom-0 left-0 w-full h-1/2 bg-[#D35400] flex items-center justify-center pb-2 px-2 text-center">
                        <span className="font-serif font-bold text-white text-sm truncate">{names.person2}</span>
                      </div>
                      <div className="absolute w-6 h-6 bg-palette-dark rounded-full border-2 border-white shadow"></div>
                    </div>
                  </div>

                  {rouletteWinner && !isSpinning && (
                    <div className="p-3 bg-palette-primary text-white rounded-xl font-bold text-lg animate-bounce shadow-md inline-block px-6">
                      {rouletteWinner} começa!
                    </div>
                  )}

                  <div>
                    <button
                      onClick={spinRoulette}
                      disabled={isSpinning}
                      className="px-6 py-3 bg-palette-primary text-white font-medium rounded-xl hover:bg-palette-accent transition disabled:opacity-50 text-sm shadow-md"
                    >
                      {isSpinning ? 'A girar a roleta...' : 'Girar Roleta'}
                    </button>
                  </div>
                </div>

                <div className="bg-palette-secondary border border-palette-border p-6 rounded-2xl text-center">
                  <h3 className="font-serif font-bold text-xl text-palette-dark mb-2">
                    Prontos para começar?
                  </h3>
                  <p className="text-sm text-palette-dark/70 mb-4">
                    Preencham o formulário, gerem o PDF e enviem um ao outro para descobrirem as coincidências!
                  </p>
                  <button
                    onClick={() => setActiveTab('form')}
                    className="px-6 py-3 bg-palette-primary text-white font-medium rounded-xl hover:bg-palette-accent transition"
                  >
                    Ir para o Formulário de Preferências →
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'form' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                  <div>
                    <h2 className="font-serif text-2xl font-bold text-palette-dark">
                      Formulário de Preferências
                    </h2>
                    <p className="text-sm text-palette-dark/60">
                      Preencha suas notas e gere o PDF no final para enviar ao seu par.
                    </p>
                  </div>

                  {/* CAMPO DE IDENTIFICAÇÃO DO SEU NOME */}
                  <div className="w-full md:w-auto bg-palette-secondary p-3 rounded-2xl border border-palette-border flex items-center gap-2">
                    <label className="text-xs font-bold text-palette-dark whitespace-nowrap">
                      Meu Nome:
                    </label>
                    <input
                      type="text"
                      value={userProfileName}
                      onChange={e => setUserProfileName(e.target.value)}
                      placeholder="Digite seu nome"
                      className="p-2 bg-white border border-palette-border rounded-xl text-xs font-bold text-palette-primary focus:outline-none w-full"
                    />
                  </div>
                </div>

                {/* CARTÕES EXPANSÍVEIS DO FORMULÁRIO */}
                <div className="space-y-4">
                  {CATEGORIES.map(cat => {
                    const isOpen = !!openCategories[cat.id];
                    
                    const ratedCount = cat.items.filter((_, idx) => {
                      const itemKey = `${cat.id}_${idx}`;
                      return (ratings[itemKey] || 0) > 0;
                    }).length;

                    return (
                      <div key={cat.id} className="bg-white rounded-3xl border border-palette-border shadow-sm overflow-hidden transition-all">
                        <button
                          onClick={() => toggleCategory(cat.id)}
                          className="w-full p-5 bg-palette-secondary/30 hover:bg-palette-secondary/60 flex items-center justify-between text-left transition"
                        >
                          <div className="flex items-center gap-3">
                            <h3 className="font-serif font-bold text-lg md:text-xl text-palette-primary">
                              {cat.title}
                            </h3>
                            <span className="text-xs bg-palette-primary/10 text-palette-primary px-2.5 py-1 rounded-full font-semibold">
                              {ratedCount}/{cat.items.length} avaliados
                            </span>
                          </div>
                          <span className="text-palette-primary font-bold text-2xl transition-transform duration-300">
                            {isOpen ? '−' : '+'}
                          </span>
                        </button>

                        {isOpen && (
                          <div className="p-6 grid md:grid-cols-2 gap-4 border-t border-palette-border bg-white">
                            {cat.items.map((item, idx) => {
                              const itemKey = `${cat.id}_${idx}`;
                              const currentStar = ratings[itemKey] || 0;

                              return (
                                <div key={idx} className="p-4 rounded-2xl border flex flex-col justify-between bg-palette-secondary/30 border-palette-border/60">
                                  <span className="font-medium text-sm text-palette-dark mb-3">
                                    {item}
                                  </span>

                                  <div className="flex items-center gap-1">
                                    {[1, 2, 3, 4, 5].map(star => (
                                      <button
                                        key={star}
                                        onClick={() => handleRating(itemKey, star)}
                                        className={`text-2xl transition-transform hover:scale-125 ${
                                          star <= currentStar ? 'text-amber-500' : 'text-gray-300'
                                        }`}
                                      >
                                        ★
                                      </button>
                                    ))}
                                    <span className="ml-2 text-xs text-palette-dark/50">
                                      {currentStar > 0 ? `${currentStar}/5` : 'Não avaliado'}
                                    </span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* BOTÃO DE GERAR PDF NO FINAL DO FORMULÁRIO */}
                <div className="bg-gradient-to-r from-palette-primary to-palette-accent p-6 rounded-3xl text-white flex flex-col md:flex-row items-center justify-between gap-4 shadow-md mt-8">
                  <div>
                    <h3 className="font-serif font-bold text-xl mb-1">
                      Finalizou suas escolhas?
                    </h3>
                    <p className="text-xs opacity-90">
                      Gere um PDF bonito com suas respostas e mande no WhatsApp para comparar com o seu amigo/a!
                    </p>
                  </div>
                  <button
                    onClick={generatePDF}
                    className="px-6 py-3 bg-white text-palette-primary font-bold rounded-2xl hover:bg-palette-secondary transition text-sm shadow-md whitespace-nowrap"
                  >
                    Baixar Meu PDF Personalizado
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'ideas' && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                <div>
                  <h2 className="font-serif text-2xl font-bold text-palette-dark">
                    Banco de Ideias para Inspirar
                  </h2>
                  <p className="text-sm text-palette-dark/60">
                    Use estas sugestões diretamente no planejamento do seu próximo encontro.
                  </p>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {CATEGORIES.map(cat => (
                    <div key={cat.id} className="p-5 bg-palette-secondary/40 rounded-2xl border border-palette-border">
                      <h3 className="font-serif font-bold text-lg text-palette-primary mb-3 pb-2 border-b border-palette-border">
                        {cat.title}
                      </h3>
                      <ul className="space-y-2">
                        {cat.items.map((item, idx) => (
                          <li key={idx} className="text-sm text-palette-dark/80 flex items-start gap-2">
                            <span className="text-palette-primary font-bold">•</span>
                            <span>{item}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'meetings' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm">
                  <h2 className="font-serif text-2xl font-bold text-palette-dark mb-2">
                    Fichas dos 12 Encontros
                  </h2>
                  <p className="text-sm text-palette-dark/60 mb-6">
                    Selecione o número do encontro para planejar os detalhes ou registrar como foi.
                  </p>

                  <div className="grid grid-cols-4 md:grid-cols-6 gap-3">
                    {meetings.map(m => (
                      <button
                        key={m.number}
                        onClick={() => setSelectedMeetingNum(m.number)}
                        className={`p-3 rounded-2xl border font-serif text-center transition flex flex-col items-center justify-center ${
                          selectedMeetingNum === m.number
                            ? 'bg-palette-primary text-white border-palette-primary shadow-md scale-105'
                            : m.status === 'completed'
                            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                            : 'bg-palette-secondary/40 text-palette-dark border border-palette-border hover:bg-palette-secondary'
                        }`}
                      >
                        <span className="text-xs uppercase font-sans tracking-widest opacity-80">
                          Nº
                        </span>
                        <span className="text-2xl font-bold">
                          {String(m.number).padStart(2, '0')}
                        </span>
                        {m.status === 'completed' && (
                          <span className="text-[10px] font-sans font-semibold bg-emerald-200 text-emerald-900 px-1.5 py-0.5 rounded mt-1">
                            Feito
                          </span>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const currentMeeting = meetings.find(m => m.number === selectedMeetingNum);
                  if (!currentMeeting) return null;

                  return (
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                      <div className="flex justify-between items-center pb-4 border-b border-palette-border">
                        <div>
                          <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">
                            Ficha de Planejamento
                          </span>
                          <h3 className="font-serif text-3xl font-bold text-palette-dark">
                            Encontro nº {String(currentMeeting.number).padStart(2, '0')}
                          </h3>
                        </div>

                        <button
                          onClick={() => handleMeetingUpdate({
                            ...currentMeeting,
                            status: currentMeeting.status === 'completed' ? 'planned' : 'completed'
                          })}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                            currentMeeting.status === 'completed'
                              ? 'bg-emerald-600 text-white'
                              : 'bg-palette-secondary text-palette-dark border border-palette-border'
                          }`}
                        >
                          {currentMeeting.status === 'completed' ? '✓ Concluído' : 'Marcar Feito'}
                        </button>
                      </div>

                      <div className="grid md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Nome da Experiência / Atividade
                          </label>
                          <input
                            type="text"
                            value={currentMeeting.title}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, title: e.target.value })}
                            placeholder="Ex: Tarde de Cerâmica & Café"
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Responsável pela Organização
                          </label>
                          <select
                            value={currentMeeting.organizer}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, organizer: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          >
                            <option value="Pessoa 1">{names.person1}</option>
                            <option value="Pessoa 2">{names.person2}</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Data Prevista
                          </label>
                          <input
                            type="date"
                            value={currentMeeting.date}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, date: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Local e Endereço
                          </label>
                          <input
                            type="text"
                            value={currentMeeting.location}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, location: e.target.value })}
                            placeholder="Ex: Parque Central ou Ateliê X"
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Horário de Saída
                          </label>
                          <input
                            type="time"
                            value={currentMeeting.timeDeparture}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, timeDeparture: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                            Retorno Previsto
                          </label>
                          <input
                            type="time"
                            value={currentMeeting.timeReturn}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, timeReturn: e.target.value })}
                            className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                          Pista ou Spoiler do Encontro
                        </label>
                        <textarea
                          rows="2"
                          value={currentMeeting.spoiler}
                          onChange={e => handleMeetingUpdate({ ...currentMeeting, spoiler: e.target.value })}
                          placeholder="Ex: Traga roupas confortáveis..."
                          className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                        ></textarea>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {activeTab === 'memories' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-border shadow-sm">
                  <h2 className="font-serif text-2xl font-bold text-palette-dark mb-2">
                    Registro das Memórias
                  </h2>
                  <p className="text-sm text-palette-dark/60 mb-6">
                    Guarde fotos, recordações e palavras especiais vividas em cada encontro.
                  </p>

                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {meetings.map(m => (
                      <button
                        key={m.number}
                        onClick={() => setSelectedMeetingNum(m.number)}
                        className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${
                          selectedMeetingNum === m.number
                            ? 'bg-palette-primary text-white'
                            : 'bg-palette-secondary/40 text-palette-dark border border-palette-border hover:bg-palette-secondary'
                        }`}
                      >
                        Encontro {String(m.number).padStart(2, '0')}
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const currentMeeting = meetings.find(m => m.number === selectedMeetingNum);
                  if (!currentMeeting) return null;

                  const memory = currentMeeting.memory || {};

                  const updateMemory = (field, val) => {
                    handleMeetingUpdate({
                      ...currentMeeting,
                      memory: { ...memory, [field]: val }
                    });
                  };

                  const handlePhotoUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                      const reader = new FileReader();
                      reader.onloadend = () => {
                        updateMemory('photo', reader.result);
                      };
                      reader.readAsDataURL(file);
                    }
                  };

                  return (
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-border shadow-sm space-y-6">
                      <div className="border-b border-palette-border pb-4">
                        <span className="text-xs font-semibold text-palette-primary uppercase tracking-widest">
                          Diário do Encontro
                        </span>
                        <h3 className="font-serif text-3xl font-bold text-palette-dark">
                          {currentMeeting.title || `Encontro ${currentMeeting.number}`}
                        </h3>
                      </div>

                      <div className="grid md:grid-cols-2 gap-6">
                        <div className="flex flex-col items-center">
                          <div className="w-full bg-palette-secondary/40 p-4 rounded-2xl border border-palette-border shadow-inner text-center">
                            {memory.photo ? (
                              <div className="relative group">
                                <img
                                  src={memory.photo}
                                  alt="Recordação"
                                  className="w-full h-64 object-cover rounded-xl shadow-md mb-3"
                                />
                                <button
                                  onClick={() => updateMemory('photo', null)}
                                  className="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-full text-xs opacity-80 hover:opacity-100"
                                >
                                  ✕ Remover
                                </button>
                              </div>
                            ) : (
                              <div className="h-64 border-2 border-dashed border-palette-border rounded-xl flex flex-col items-center justify-center p-6 text-palette-dark/40">
                                <span className="text-4xl mb-2">📷</span>
                                <p className="text-xs mb-4">Adicione uma foto, ingresso ou recordação</p>
                                <label className="cursor-pointer px-4 py-2 bg-palette-primary text-white rounded-xl text-xs font-semibold hover:bg-palette-accent transition">
                                  Carregar Foto
                                  <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                </label>
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                              Uma palavra para definir esse encontro:
                            </label>
                            <input
                              type="text"
                              value={memory.word || ''}
                              onChange={e => updateMemory('word', e.target.value)}
                              placeholder="Ex: Mágico, Inesquecível..."
                              className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary font-serif font-bold text-palette-primary"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                              O que mais gostei ou me surpreendeu:
                            </label>
                            <textarea
                              rows="2"
                              value={memory.likedMost || ''}
                              onChange={e => updateMemory('likedMost', e.target.value)}
                              className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                            ></textarea>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                              Um momento que quero guardar na memória:
                            </label>
                            <textarea
                              rows="2"
                              value={memory.momentToKeep || ''}
                              onChange={e => updateMemory('momentToKeep', e.target.value)}
                              className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                            ></textarea>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-dark/70 mb-1">
                              Uma ideia para o próximo encontro:
                            </label>
                            <input
                              type="text"
                              value={memory.nextIdea || ''}
                              onChange={e => updateMemory('nextIdea', e.target.value)}
                              className="w-full p-3 bg-palette-secondary/40 border border-palette-border rounded-xl text-sm focus:outline-none focus:border-palette-primary"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
          </main>

          {/* TEMPLATE DO PDF ESCONDIDO */}
          <div id="pdf-template" style={{ display: 'none', padding: '20px', fontFamily: 'Plus Jakarta Sans, sans-serif' }}>
            <div style={{ textAlign: 'center', borderBottom: '2px solid #D35400', paddingBottom: '15px', marginBottom: '20px' }}>
              <span style={{ fontSize: '10px', color: '#D35400', textTransform: 'uppercase', fontWeight: 'bold' }}>
                Guia de Experiências & Encontros
              </span>
              <h1 style={{ fontFamily: 'Playfair Display, serif', color: '#4A235A', fontSize: '24px', margin: '5px 0' }}>
                Aventura, Leveza e Companhia
              </h1>
              <p style={{ fontSize: '14px', color: '#D35400', fontWeight: 'bold', margin: 0 }}>
                Perfil de Preferências: {userProfileName || 'Anônimo'}
              </p>
            </div>

            {CATEGORIES.map(cat => (
              <div key={cat.id} style={{ marginBottom: '15px' }}>
                <h3 style={{ fontSize: '14px', color: '#D35400', borderBottom: '1px solid #EADCD7', paddingBottom: '4px', margin: '10px 0' }}>
                  {cat.title}
                </h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  {cat.items.map((item, idx) => {
                    const key = `${cat.id}_${idx}`;
                    const score = ratings[key] || 0;
                    return (
                      <div key={idx} style={{ padding: '6px 10px', backgroundColor: '#FAF6F0', borderRadius: '8px', border: '1px solid #EADCD7', fontSize: '11px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span>{item}</span>
                        <strong style={{ color: score >= 4 ? '#D35400' : '#4A235A' }}>
                          {score > 0 ? `${score} ★` : '-'}
                        </strong>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
