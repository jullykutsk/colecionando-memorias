<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Guia de Encontros</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Playfair Display & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            // Nova paleta baseada na imagem enviada
            palette: {
              slate: '#5A6B7C',      // Cinza ardósia / azulado
              silver: '#C4C7C9',     // Cinza claro / prata
              offwhite: '#F4F5F6',   // Fundo claro suave
              lightgreen: '#A4C68B', // Verde claro suave
              olive: '#638C48',      // Verde médio / oliva
              darkgreen: '#1B382B'   // Verde escuro floresta
            },
            journal: {
              bg: '#F4F5F6',
              card: '#FFFFFF',
              border: '#C4C7C9',
              text: '#1B382B',
              accent: '#638C48',
              secondary: '#E8ECEF'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #F4F5F6;
      color: #1B382B;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .paper-texture {
      background-image: radial-gradient(#C4C7C9 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="paper-texture min-h-screen pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      {
        id: 'A',
        title: 'A. Natureza e Água',
        items: [
          'Tomar banho em uma cachoeira',
          'Fazer uma trilha ao ar livre',
          'Escalar uma montanha / mirante',
          'Conhecer uma praia, rio ou lago',
          'Passeio de caiaque ou pedalinho',
          'Andar de barco',
          'Fazer um piquenique ao ar livre',
          'Acampar ou passar uma noite num lugar diferente',
          'Observar as estrelas à noite',
          'Fazer uma trilha no nascer ou pôr do sol'
        ]
      },
      {
        id: 'B',
        title: 'B. Aventura e Novas Sensações',
        items: [
          'Fazer escalada indoor',
          'Andar a cavalo',
          'Fazer arvorismo ou tirolesa',
          'Andar de kart',
          'Experimentar um esporte novo',
          'Visitar um parque de aventuras',
          'Fazer um passeio de patinete / bike',
          'Experimentar uma atividade de adrenalina',
          'Fazer algo totalmente inédito'
        ]
      },
      {
        id: 'C',
        title: 'C. Animais e Descobertas',
        items: [
          'Ter contato direto com animais',
          'Visitar uma fazenda ou sítio',
          'Conhecer um parque/santuário animal',
          'Observar animais na natureza',
          'Conhecer um local ou espécie nova de perto'
        ]
      },
      {
        id: 'D',
        title: 'D. Cultura, Arte e Criatividade',
        items: [
          'Visitar um museu ou exposição',
          'Ir ao teatro ou concerto',
          'Assistir a um show ao vivo',
          'Fazer oficina de cerâmica/argila',
          'Experimentar pintura ou desenho',
          'Fazer atividade de fotografia',
          'Participar de uma aula de culinária',
          'Fazer uma aula de dança juntos',
          'Conhecer um lugar histórico',
          'Visitar uma livraria ou biblioteca temática',
          'Aprender uma habilidade nova juntos'
        ]
      },
      {
        id: 'E',
        title: 'E. Jogos, Desafios e Diversão',
        items: [
          'Participar de um Escape Room',
          'Jogar jogos de tabuleiro à tarde',
          'Caça ao tesouro / enigmas',
          'Jogar boliche',
          'Ir a um fliperama / arcade',
          'Jogo de perguntas e desafios íntimos',
          'Fazer uma competição divertida',
          'Desafio de trabalho em equipe'
        ]
      },
      {
        id: 'F',
        title: 'F. Gastronomia e Experiências',
        items: [
          'Passeio gastronômico na cidade',
          'Conhecer um restaurante exótico',
          'Experimentar uma comida inédita',
          'Cozinhar uma receita elaborada juntos',
          'Degustação de doces ou tour de cafés',
          'Visitar uma cafeteria temática',
          'Preparar um jantar especial',
          'Descobrir um cantinho escondido da cidade'
        ]
      },
      {
        id: 'G',
        title: 'G. Encontros e Momentos Especiais',
        items: [
          'Passeio tranquilo sem pressa',
          'Conversa profunda em um lugar bonito',
          'Assistir ao pôr do sol juntos',
          'Passeio surpresa de presente',
          'Lugar novo sem saber os detalhes',
          'Criar um projeto ou arte juntos',
          'Atividade voluntária / solidária',
          'Passar algumas horas sem celular',
          'Passeio super econômico e criativo',
          'Planejar uma experiência com significado'
        ]
      }
    ];

    const INITIAL_MEETINGS = Array.from({ length: 12 }, (_, i) => ({
      number: i + 1,
      title: `Encontro ${String(i + 1).padStart(2, '0')}`,
      organizer: i % 2 === 0 ? 'Pessoa 1' : 'Pessoa 2',
      date: '',
      location: '',
      timeDeparture: '',
      timeReturn: '',
      spoiler: '',
      status: 'planned',
      memory: {
        photo: null,
        word: '',
        likedMost: '',
        momentToKeep: '',
        wouldRepeat: '',
        nextIdea: ''
      }
    }));

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [ratings, setRatings] = useState(() => {
        const saved = localStorage.getItem('guia_ratings');
        return saved ? JSON.parse(saved) : { person1: {}, person2: {} };
      });
      const [activePerson, setActivePerson] = useState('person1');
      const [meetings, setMeetings] = useState(() => {
        const saved = localStorage.getItem('guia_meetings');
        return saved ? JSON.parse(saved) : INITIAL_MEETINGS;
      });
      const [selectedMeetingNum, setSelectedMeetingNum] = useState(1);
      const [showJourneyModal, setShowJourneyModal] = useState(false);

      useEffect(() => {
        localStorage.setItem('guia_ratings', JSON.stringify(ratings));
      }, [ratings]);

      useEffect(() => {
        localStorage.setItem('guia_meetings', JSON.stringify(meetings));
      }, [meetings]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleRating = (itemKey, stars) => {
        setRatings(prev => ({
          ...prev,
          [activePerson]: {
            ...prev[activePerson],
            [itemKey]: stars
          }
        }));
      };

      const handleMeetingUpdate = (updatedMeeting) => {
        setMeetings(prev => prev.map(m => m.number === updatedMeeting.number ? updatedMeeting : m));
      };

      const completedCount = meetings.filter(m => m.status === 'completed').length;

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <header className="text-center my-8 border-b border-palette-silver pb-8">
            <span className="inline-block px-3 py-1 bg-palette-lightgreen/30 text-palette-darkgreen rounded-full text-xs font-semibold tracking-wider uppercase mb-3">
              Guia de Amizade & Relacionamento
            </span>
            <h1 className="font-serif text-4xl md:text-5xl text-palette-darkgreen font-bold mb-3">
              Nosso Guia de Encontros
            </h1>

            <div className="mt-6 max-w-xs mx-auto bg-palette-secondary p-3 rounded-2xl border border-palette-silver">
              <div className="flex justify-between text-xs font-semibold text-palette-darkgreen mb-1">
                <span>Jornada dos 12 Encontros</span>
                <span>{completedCount} de 12 concluídos</span>
              </div>
              <div className="w-full bg-palette-silver h-2.5 rounded-full overflow-hidden">
                <div 
                  className="bg-palette-olive h-full transition-all duration-500 rounded-full"
                  style={{ width: `${(completedCount / 12) * 100}%` }}
                ></div>
              </div>
            </div>
          </header>

          <nav className="flex justify-center gap-2 md:gap-3 mb-8 overflow-x-auto pb-2">
            {[
              { id: 'home', label: 'Introdução' },
              { id: 'form', label: 'Formulário' },
              { id: 'ideas', label: 'Banco de Ideias' },
              { id: 'meetings', label: '12 Encontros' },
              { id: 'memories', label: 'Memórias' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                  activeTab === tab.id
                    ? 'bg-palette-darkgreen text-white shadow-md'
                    : 'bg-white text-palette-darkgreen hover:bg-palette-secondary border border-palette-silver'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          <main>
            {activeTab === 'home' && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-silver shadow-sm space-y-6">
                
                <div 
                  onClick={() => setShowJourneyModal(true)}
                  className="cursor-pointer bg-gradient-to-r from-palette-offwhite to-palette-secondary border-2 border-palette-olive/40 p-6 rounded-3xl shadow-sm hover:border-palette-olive transition group"
                >
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-xs font-semibold text-palette-olive uppercase tracking-widest">
                        Toque para abrir a mensagem
                      </span>
                      <h2 className="font-serif text-2xl md:text-3xl font-bold text-palette-darkgreen group-hover:text-palette-olive transition">
                        1. Uma Jornada de Descobertas ✨
                      </h2>
                    </div>
                    <span className="text-2xl text-palette-olive font-bold group-hover:translate-x-1 transition">→</span>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-4 my-6">
                  <div className="p-5 bg-palette-offwhite rounded-2xl border border-palette-silver">
                    <h3 className="font-semibold text-palette-darkgreen text-lg mb-2">
                      1. Alternar a Responsabilidade
                    </h3>
                    <p className="text-sm text-palette-darkgreen/80">
                      Ao longo dos 12 encontros, cada um fica responsável por organizar a experiência. Quem organiza escolhe a atividade, pesquisa e cuida dos detalhes.
                    </p>
                  </div>

                  <div className="p-5 bg-palette-offwhite rounded-2xl border border-palette-silver">
                    <h3 className="font-semibold text-palette-darkgreen text-lg mb-2">
                      2. Respeitar o Ritmo
                    </h3>
                    <p className="text-sm text-palette-darkgreen/80">
                      Não se trata de cumprir uma lista ou fazer tudo dar certo. Não precisamos fazer grandes viagens ou gastar muito. O objetivo é criar oportunidades leves.
                    </p>
                  </div>
                </div>

                <div className="bg-palette-secondary border border-palette-silver p-6 rounded-2xl text-center">
                  <h3 className="font-serif font-bold text-xl text-palette-darkgreen mb-2">
                    Prontos para começar?
                  </h3>
                  <p className="text-sm text-palette-darkgreen/70 mb-4">
                    Primeiro passo: Preencham o Formulário de Preferências individualmente para descobrirem as afinidades!
                  </p>
                  <button
                    onClick={() => setActiveTab('form')}
                    className="px-6 py-3 bg-palette-darkgreen text-white font-medium rounded-xl hover:bg-palette-olive transition"
                  >
                    Ir para o Formulário de Preferências →
                  </button>
                </div>
              </div>
            )}

            {showJourneyModal && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white max-w-lg w-full p-6 md:p-8 rounded-3xl border border-palette-silver shadow-2xl relative space-y-4">
                  <button 
                    onClick={() => setShowJourneyModal(false)}
                    className="absolute top-4 right-4 bg-palette-secondary text-palette-darkgreen w-8 h-8 rounded-full font-bold flex items-center justify-center hover:bg-palette-silver transition"
                  >
                    ✕
                  </button>

                  <span className="text-xs font-semibold text-palette-olive uppercase tracking-widest">
                    Mensagem Especial
                  </span>
                  
                  <h3 className="font-serif text-2xl md:text-3xl font-bold text-palette-darkgreen">
                    Uma Jornada de Descobertas
                  </h3>

                  <p className="leading-relaxed text-palette-darkgreen/95 text-base md:text-lg bg-palette-offwhite p-5 rounded-2xl border border-palette-silver">
                    Este é um convite para viver um tempo de descobertas, compartilhar experiências e fortalecer a amizade com tempo, carinho e liberdade. A ideia é sair um pouquinho da rotina, experimentar coisas novas e conhecer melhor os gostos, os sonhos e os jeitos de cada um.
                  </p>

                  <div className="pt-2 text-center">
                    <button
                      onClick={() => setShowJourneyModal(false)}
                      className="px-6 py-2.5 bg-palette-darkgreen text-white font-medium rounded-xl hover:bg-palette-olive transition text-sm"
                    >
                      Fechar e Continuar
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'form' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-silver shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                  <div>
                    <h2 className="font-serif text-2xl font-bold text-palette-darkgreen">
                      Formulário de Preferências
                    </h2>
                    <p className="text-sm text-palette-darkgreen/60">
                      Avalie cada experiência de 1 a 5 estrelas.
                    </p>
                  </div>

                  <div className="flex bg-palette-offwhite p-1.5 rounded-2xl border border-palette-silver w-full md:w-auto justify-center">
                    <button
                      onClick={() => setActivePerson('person1')}
                      className={`px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition ${
                        activePerson === 'person1'
                          ? 'bg-palette-darkgreen text-white shadow-sm'
                          : 'text-palette-darkgreen/70 hover:text-palette-darkgreen'
                      }`}
                    >
                      Pessoa 1
                    </button>
                    <button
                      onClick={() => setActivePerson('person2')}
                      className={`px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition ${
                        activePerson === 'person2'
                          ? 'bg-palette-darkgreen text-white shadow-sm'
                          : 'text-palette-darkgreen/70 hover:text-palette-darkgreen'
                      }`}
                    >
                      Pessoa 2
                    </button>
                  </div>
                </div>

                <div className="space-y-6">
                  {CATEGORIES.map(cat => (
                    <div key={cat.id} className="bg-white p-6 rounded-3xl border border-palette-silver shadow-sm">
                      <h3 className="font-serif font-bold text-xl text-palette-olive mb-4 pb-2 border-b border-palette-silver">
                        {cat.title}
                      </h3>

                      <div className="grid md:grid-cols-2 gap-4">
                        {cat.items.map((item, idx) => {
                          const itemKey = `${cat.id}_${idx}`;
                          const currentStar = ratings[activePerson]?.[itemKey] || 0;

                          return (
                            <div key={idx} className="p-4 bg-palette-offwhite rounded-2xl border border-palette-silver/60 flex flex-col justify-between">
                              <span className="font-medium text-sm text-palette-darkgreen mb-3">
                                {item}
                              </span>

                              <div className="flex items-center gap-1">
                                {[1, 2, 3, 4, 5].map(star => (
                                  <button
                                    key={star}
                                    onClick={() => handleRating(itemKey, star)}
                                    className={`text-2xl transition-transform hover:scale-125 ${
                                      star <= currentStar ? 'text-amber-500' : 'text-gray-300'
                                    }`}
                                  >
                                    ★
                                  </button>
                                ))}
                                <span className="ml-2 text-xs text-palette-darkgreen/50">
                                  {currentStar > 0 ? `${currentStar}/5` : 'Não avaliado'}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-white p-6 rounded-3xl border border-palette-silver shadow-sm">
                  <h3 className="font-serif font-bold text-2xl text-palette-darkgreen mb-2">
                    Afinidades Encontradas (Coincidências)
                  </h3>
                  <p className="text-sm text-palette-darkgreen/60 mb-6">
                    Experiências que ambos avaliaram com nota alta (4 ou 5 estrelas):
                  </p>

                  <div className="space-y-3">
                    {(() => {
                      const matches = [];
                      CATEGORIES.forEach(cat => {
                        cat.items.forEach((item, idx) => {
                          const key = `${cat.id}_${idx}`;
                          const r1 = ratings.person1?.[key] || 0;
                          const r2 = ratings.person2?.[key] || 0;
                          if (r1 >= 4 && r2 >= 4) {
                            matches.push({ item, category: cat.title });
                          }
                        });
                      });

                      if (matches.length === 0) {
                        return (
                          <div className="text-center py-8 text-palette-darkgreen/50 italic bg-palette-offwhite rounded-2xl border border-dashed border-palette-silver">
                            Preencham os formulários como Pessoa 1 e Pessoa 2 com notas 4 ou 5 para verem as afinidades em comum aqui!
                          </div>
                        );
                      }

                      return matches.map((m, i) => (
                        <div key={i} className="p-4 bg-palette-offwhite border border-palette-silver rounded-2xl flex items-center justify-between">
                          <span className="font-semibold text-palette-darkgreen">{m.item}</span>
                          <span className="text-xs bg-palette-lightgreen/40 text-palette-darkgreen px-3 py-1 rounded-full font-medium">
                            {m.category.split('.')[1]}
                          </span>
                        </div>
                      ));
                    })()}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'ideas' && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-silver shadow-sm space-y-6">
                <div>
                  <h2 className="font-serif text-2xl font-bold text-palette-darkgreen">
                    Banco de Ideias para Inspirar
                  </h2>
                  <p className="text-sm text-palette-darkgreen/60">
                    Use estas sugestões diretamente no planejamento do seu próximo encontro.
                  </p>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {CATEGORIES.map(cat => (
                    <div key={cat.id} className="p-5 bg-palette-offwhite rounded-2xl border border-palette-silver">
                      <h3 className="font-serif font-bold text-lg text-palette-olive mb-3 pb-2 border-b border-palette-silver">
                        {cat.title}
                      </h3>
                      <ul className="space-y-2">
                        {cat.items.map((item, idx) => (
                          <li key={idx} className="text-sm text-palette-darkgreen/80 flex items-start gap-2">
                            <span className="text-palette-olive font-bold">•</span>
                            <span>{item}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'meetings' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-silver shadow-sm">
                  <h2 className="font-serif text-2xl font-bold text-palette-darkgreen mb-2">
                    Fichas dos 12 Encontros
                  </h2>
                  <p className="text-sm text-palette-darkgreen/60 mb-6">
                    Selecione o número do encontro para planejar os detalhes ou registrar como foi.
                  </p>

                  <div className="grid grid-cols-4 md:grid-cols-6 gap-3">
                    {meetings.map(m => (
                      <button
                        key={m.number}
                        onClick={() => setSelectedMeetingNum(m.number)}
                        className={`p-3 rounded-2xl border font-serif text-center transition flex flex-col items-center justify-center ${
                          selectedMeetingNum === m.number
                            ? 'bg-palette-darkgreen text-white border-palette-darkgreen shadow-md scale-105'
                            : m.status === 'completed'
                            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                            : 'bg-palette-offwhite text-palette-darkgreen border-palette-silver hover:bg-palette-secondary'
                        }`}
                      >
                        <span className="text-xs uppercase font-sans tracking-widest opacity-80">
                          Nº
                        </span>
                        <span className="text-2xl font-bold">
                          {String(m.number).padStart(2, '0')}
                        </span>
                        {m.status === 'completed' && (
                          <span className="text-[10px] font-sans font-semibold bg-emerald-200 text-emerald-900 px-1.5 py-0.5 rounded mt-1">
                            Feito
                          </span>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const currentMeeting = meetings.find(m => m.number === selectedMeetingNum);
                  if (!currentMeeting) return null;

                  return (
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-silver shadow-sm space-y-6">
                      <div className="flex justify-between items-center pb-4 border-b border-palette-silver">
                        <div>
                          <span className="text-xs font-semibold text-palette-olive uppercase tracking-widest">
                            Ficha de Planejamento
                          </span>
                          <h3 className="font-serif text-3xl font-bold text-palette-darkgreen">
                            Encontro nº {String(currentMeeting.number).padStart(2, '0')}
                          </h3>
                        </div>

                        <button
                          onClick={() => handleMeetingUpdate({
                            ...currentMeeting,
                            status: currentMeeting.status === 'completed' ? 'planned' : 'completed'
                          })}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                            currentMeeting.status === 'completed'
                              ? 'bg-emerald-600 text-white'
                              : 'bg-palette-secondary text-palette-darkgreen border border-palette-silver'
                          }`}
                        >
                          {currentMeeting.status === 'completed' ? '✓ Concluído' : 'Marcar Feito'}
                        </button>
                      </div>

                      <div className="grid md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Nome da Experiência / Atividade
                          </label>
                          <input
                            type="text"
                            value={currentMeeting.title}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, title: e.target.value })}
                            placeholder="Ex: Tarde de Cerâmica & Café"
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Responsável pela Organização
                          </label>
                          <select
                            value={currentMeeting.organizer}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, organizer: e.target.value })}
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          >
                            <option value="Pessoa 1">Pessoa 1</option>
                            <option value="Pessoa 2">Pessoa 2</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Data Prevista
                          </label>
                          <input
                            type="date"
                            value={currentMeeting.date}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, date: e.target.value })}
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Local e Endereço
                          </label>
                          <input
                            type="text"
                            value={currentMeeting.location}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, location: e.target.value })}
                            placeholder="Ex: Parque Central ou Ateliê X"
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Horário de Saída
                          </label>
                          <input
                            type="time"
                            value={currentMeeting.timeDeparture}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, timeDeparture: e.target.value })}
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                            Retorno Previsto
                          </label>
                          <input
                            type="time"
                            value={currentMeeting.timeReturn}
                            onChange={e => handleMeetingUpdate({ ...currentMeeting, timeReturn: e.target.value })}
                            className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                          Pista ou Spoiler do Encontro
                        </label>
                        <textarea
                          rows="2"
                          value={currentMeeting.spoiler}
                          onChange={e => handleMeetingUpdate({ ...currentMeeting, spoiler: e.target.value })}
                          placeholder="Ex: Traga roupas confortáveis..."
                          className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                        ></textarea>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {activeTab === 'memories' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-palette-silver shadow-sm">
                  <h2 className="font-serif text-2xl font-bold text-palette-darkgreen mb-2">
                    Registro das Memórias
                  </h2>
                  <p className="text-sm text-palette-darkgreen/60 mb-6">
                    Guarde fotos, recordações e palavras especiais vividas em cada encontro.
                  </p>

                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {meetings.map(m => (
                      <button
                        key={m.number}
                        onClick={() => setSelectedMeetingNum(m.number)}
                        className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${
                          selectedMeetingNum === m.number
                            ? 'bg-palette-darkgreen text-white'
                            : 'bg-palette-offwhite text-palette-darkgreen border border-palette-silver hover:bg-palette-secondary'
                        }`}
                      >
                        Encontro {String(m.number).padStart(2, '0')}
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const currentMeeting = meetings.find(m => m.number === selectedMeetingNum);
                  if (!currentMeeting) return null;

                  const memory = currentMeeting.memory || {};

                  const updateMemory = (field, val) => {
                    handleMeetingUpdate({
                      ...currentMeeting,
                      memory: { ...memory, [field]: val }
                    });
                  };

                  const handlePhotoUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                      const reader = new FileReader();
                      reader.onloadend = () => {
                        updateMemory('photo', reader.result);
                      };
                      reader.readAsDataURL(file);
                    }
                  };

                  return (
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-palette-silver shadow-sm space-y-6">
                      <div className="border-b border-palette-silver pb-4">
                        <span className="text-xs font-semibold text-palette-olive uppercase tracking-widest">
                          Diário do Encontro
                        </span>
                        <h3 className="font-serif text-3xl font-bold text-palette-darkgreen">
                          {currentMeeting.title || `Encontro ${currentMeeting.number}`}
                        </h3>
                      </div>

                      <div className="grid md:grid-cols-2 gap-6">
                        <div className="flex flex-col items-center">
                          <div className="w-full bg-palette-offwhite p-4 rounded-2xl border border-palette-silver shadow-inner text-center">
                            {memory.photo ? (
                              <div className="relative group">
                                <img
                                  src={memory.photo}
                                  alt="Recordação"
                                  className="w-full h-64 object-cover rounded-xl shadow-md mb-3"
                                />
                                <button
                                  onClick={() => updateMemory('photo', null)}
                                  className="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-full text-xs opacity-80 hover:opacity-100"
                                >
                                  ✕ Remover
                                </button>
                              </div>
                            ) : (
                              <div className="h-64 border-2 border-dashed border-palette-silver rounded-xl flex flex-col items-center justify-center p-6 text-palette-darkgreen/40">
                                <span className="text-4xl mb-2">📷</span>
                                <p className="text-xs mb-4">Adicione uma foto, ingresso ou recordação</p>
                                <label className="cursor-pointer px-4 py-2 bg-palette-darkgreen text-white rounded-xl text-xs font-semibold hover:bg-palette-olive transition">
                                  Carregar Foto
                                  <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                </label>
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                              Uma palavra para definir esse encontro:
                            </label>
                            <input
                              type="text"
                              value={memory.word || ''}
                              onChange={e => updateMemory('word', e.target.value)}
                              placeholder="Ex: Mágico, Inesquecível..."
                              className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive font-serif font-bold text-palette-olive"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                              O que mais gostei ou me surpreendeu:
                            </label>
                            <textarea
                              rows="2"
                              value={memory.likedMost || ''}
                              onChange={e => updateMemory('likedMost', e.target.value)}
                              className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                            ></textarea>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                              Um momento que quero guardar na memória:
                            </label>
                            <textarea
                              rows="2"
                              value={memory.momentToKeep || ''}
                              onChange={e => updateMemory('momentToKeep', e.target.value)}
                              className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                            ></textarea>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-palette-darkgreen/70 mb-1">
                              Uma ideia para o próximo encontro:
                            </label>
                            <input
                              type="text"
                              value={memory.nextIdea || ''}
                              onChange={e => updateMemory('nextIdea', e.target.value)}
                              className="w-full p-3 bg-palette-offwhite border border-palette-silver rounded-xl text-sm focus:outline-none focus:border-palette-olive"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
